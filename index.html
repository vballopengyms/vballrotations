<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volleyball Rotation Tracker</title>
    <style>
        :root {
            --court-color: #e59c6b;
            --line-color: #ffffff;
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --accent: #4CAF50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin-bottom: 20px; }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            max-width: 1000px;
            width: 100%;
            justify-content: center;
        }

        .setup-panel {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 350px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-size: 0.85em;
            color: #ccc;
        }

        select, input {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #333;
            color: white;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover { background-color: #45a049; }
        button.secondary { background-color: #555; }
        button.secondary:hover { background-color: #666; }

        .court-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .net {
            width: 320px;
            height: 10px;
            background: repeating-linear-gradient(45deg, #444, #444 5px, #222 5px, #222 10px);
            border: 2px solid white;
            margin-bottom: -2px;
            z-index: 2;
        }

        .court {
            width: 320px;
            height: 320px;
            background-color: var(--court-color);
            border: 4px solid var(--line-color);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            position: relative;
        }

        .court::after {
            content: '';
            position: absolute;
            top: 33.33%;
            left: 0;
            right: 0;
            height: 4px;
            background-color: var(--line-color);
        }

        .zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 5px;
            z-index: 1;
        }

        .player-badge {
            background: #222;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.85em;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 4px;
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .role-badge {
            font-size: 0.7em;
            background: var(--accent);
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
        }

        .rotation-controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .rot-circle {
            background: #333;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Volleyball Rotation Tracker</h1>

    <div class="container">
        <!-- SETUP PANEL -->
        <div class="setup-panel">
            <div class="form-group">
                <label><strong>Rotation System</strong></label>
                <select id="systemSelect" onchange="renderInputs()">
                    <option value="5-1">5-1 (1 Setter, 1 Opposite)</option>
                    <option value="6-2" selected>6-2 (2 Setters, 3 Hitters)</option>
                    <option value="4-2">4-2 (2 Setters in Front Row)</option>
                </select>
            </div>

            <div id="playerInputs"></div>
        </div>

        <!-- COURT PANEL -->
        <div class="court-panel">
            <div class="net"></div>
            <div class="court">
                <div class="zone" id="pos4"></div>
                <div class="zone" id="pos3"></div>
                <div class="zone" id="pos2"></div>
                <div class="zone" id="pos5"></div>
                <div class="zone" id="pos6"></div>
                <div class="zone" id="pos1"></div>
            </div>

            <div class="rotation-controls">
                <button class="secondary" onclick="rotateCourt(-1)">Reverse</button>
                <div class="rot-circle">R<span id="rotNum">1</span></div>
                <button onclick="rotateCourt(1)">Rotate >></button>
            </div>
        </div>
    </div>

    <script>
        const systems = {
            "5-1": ["Setter", "Outside 1", "Middle 1", "Opposite", "Outside 2", "Middle 2"],
            "6-2": ["Setter 1", "Outside 1", "Middle 1", "Setter 2", "Outside 2", "Middle 2"],
            "4-2": ["Setter 1", "Outside 1", "Middle 1", "Setter 2", "Outside 2", "Middle 2"]
        };

        let currentRotation = 1;
        let playerNames = ["", "", "", "", "", ""];

        function renderInputs() {
            const system = document.getElementById("systemSelect").value;
            const roles = systems[system];
            const container = document.getElementById("playerInputs");
            
            let html = "";
            roles.forEach((role, i) => {
                html += `
                    <div class="form-group">
                        <label>${role} (Pos ${i+1})</label>
                        <input type="text" id="player-${i}" value="${playerNames[i]}" placeholder="Enter player name..." oninput="updateName(${i}, this.value)">
                    </div>
                `;
            });
            container.innerHTML = html;
            updateCourt();
        }

        function updateName(index, val) {
            playerNames[index] = val;
            updateCourt();
        }

        function rotateCourt(direction) {
            if (direction === 1) {
                playerNames.push(playerNames.shift());
                currentRotation = currentRotation === 6 ? 1 : currentRotation + 1;
            } else {
                playerNames.unshift(playerNames.pop());
                currentRotation = currentRotation === 1 ? 6 : currentRotation - 1;
            }
            renderInputs();
        }

        function updateCourt() {
            document.getElementById("rotNum").innerText = currentRotation;
            const system = document.getElementById("systemSelect").value;
            const roles = systems[system];

            // Pos1, Pos2, Pos3, Pos4, Pos5, Pos6
            const zoneIds = ["pos1", "pos2", "pos3", "pos4", "pos5", "pos6"];

            zoneIds.forEach((id, i) => {
                const name = playerNames[i].trim() !== "" ? playerNames[i] : `Player ${i+1}`;
                document.getElementById(id).innerHTML = `
                    <div class="player-badge">${name}</div>
                    <div class="role-badge">${roles[i]}</div>
                `;
            });
        }

        window.onload = renderInputs;
    </script>
</body>
</html>
