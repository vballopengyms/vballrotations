<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>13U Titans Animated Rotation Tracker</title>
    <style>
        :root {
            --court-color: #e59c6b;
            --line-color: #ffffff;
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --accent: #4CAF50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin-bottom: 5px; }
        .subtitle { color: #888; margin-bottom: 20px; font-weight: bold; }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 1000px;
            width: 100%;
            justify-content: center;
        }

        .setup-panel {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 320px;
        }

        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-size: 0.85em; color: #ccc; }
        input { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #444; background: #333; color: white; box-sizing: border-box; }

        .mode-toggle { display: flex; gap: 10px; margin-bottom: 15px; }
        .mode-toggle button { flex: 1; padding: 8px; font-size: 0.85em; }

        button {
            padding: 10px 15px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover { background-color: #45a049; }
        button.secondary { background-color: #555; }
        button.secondary:hover { background-color: #666; }
        button.active { background-color: #2196F3; }
        button.motion-btn { background-color: #FF9800; width: 100%; margin-top: 10px; }

        .court-panel { display: flex; flex-direction: column; align-items: center; }

        .net {
            width: 360px;
            height: 10px;
            background: repeating-linear-gradient(45deg, #444, #444 5px, #222 5px, #222 10px);
            border: 2px solid white;
            margin-bottom: -2px;
            z-index: 2;
        }

        .court {
            width: 360px;
            height: 360px;
            background-color: var(--court-color);
            border: 4px solid var(--line-color);
            position: relative;
            overflow: hidden;
        }

        .court::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 4px;
            background-color: var(--line-color);
        }

        .player-token {
            position: absolute;
            width: 90px;
            height: 55px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* Smooth Motion Transition */
            transition: left 0.8s ease-in-out, top 0.8s ease-in-out;
            z-index: 3;
        }

        .player-badge {
            background: #222;
            color: white;
            padding: 3px 6px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.8em;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .role-badge {
            font-size: 0.65em;
            padding: 2px 5px;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            margin-top: 2px;
        }

        .role-S { background-color: #d32f2f; }
        .role-OH1 { background-color: #7b1fa2; }
        .role-OH2 { background-color: #0288d1; }
        .role-M1 { background-color: #c2185b; }
        .role-M2 { background-color: #e91e63; }
        .role-OP { background-color: #388e3c; }
        .role-L { background-color: #fbc02d; color: #000; }

        .rotation-controls { margin-top: 20px; display: flex; gap: 15px; align-items: center; }
        .rot-circle { background: #333; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .sub-notice { margin-top: 10px; font-size: 0.8em; color: #ffb74d; background: #332701; padding: 6px; border-radius: 4px; border: 1px solid #ffb74d; }
    </style>
</head>
<body>

    <h1>Volleyball Rotation Tracker</h1>
    <div class="subtitle">System: 13U Titans (Animated Motion)</div>

    <div class="container">
        <!-- SETUP PANEL -->
        <div class="setup-panel">
            <div class="form-group">
                <label><strong>Phase View</strong></label>
                <div class="mode-toggle">
                    <button id="btnServing" class="active" onclick="setPhase('serving')">Serving</button>
                    <button id="btnSR" class="secondary" onclick="setPhase('sr')">Serve Receive</button>
                </div>
            </div>

            <button id="btnMotion" class="motion-btn" onclick="toggleMotion()">▶ Animate Shift / Transition</button>

            <div id="playerInputs" style="margin-top:15px;"></div>
            <div id="subAlert" class="sub-notice" style="display:none;">
                ⚠️ <strong>Front-Row Sub:</strong> Nay Nay rotates out / S2 (Kathy / Kai) enters at position 1.
            </div>
        </div>

        <!-- COURT PANEL -->
        <div class="court-panel">
            <div class="net"></div>
            <div class="court" id="courtArea"></div>

            <div class="rotation-controls">
                <button class="secondary" onclick="rotateCourt(-1)">Reverse</button>
                <div class="rot-circle">R<span id="rotNum">1</span></div>
                <button onclick="rotateCourt(1)">Rotate >></button>
            </div>
        </div>
    </div>

    <script>
        let currentRotation = 1;
        let phase = 'serving';
        let isShifted = false;

        let players = {
            S1: "Nay Nay", S2: "Kathy / Kai",
            OH1: "Eiza", OH2: "Daisy",
            M1: "Reb", M2: "Janelle",
            OP: "Teresa", L: "Janelle (L)"
        };

        // Grid coordinates in pixels (left, top) for standard court positions
        const standardCoords = {
            1: { left: 240, top: 250 }, // Pos 1 (Back Right)
            2: { left: 240, top: 50 },  // Pos 2 (Front Right)
            3: { left: 135, top: 50 },  // Pos 3 (Front Center)
            4: { left: 30,  top: 50 },  // Pos 4 (Front Left)
            5: { left: 30,  top: 250 }, // Pos 5 (Back Left)
            6: { left: 135, top: 250 }  // Pos 6 (Back Center)
        };

        // Shifted base positions after serve/receive
        const shiftedCoords = {
            1: { left: 240, top: 250 }, // Setter/Oppo base
            2: { left: 240, top: 30 },  // Setter/Oppo front base
            3: { left: 135, top: 30 },  // Middle front base
            4: { left: 30,  top: 30 },  // Outside front base
            5: { left: 30,  top: 250 }, // Outside back base
            6: { left: 135, top: 250 }  // Libero/Middle back base
        };

        const rotationData = {
            1: [
                { role: "S", code: "S1", startPos: 1, endPos: 2 },
                { role: "OH1", code: "OH1", startPos: 2, endPos: 4 },
                { role: "M2", code: "M2", startPos: 3, endPos: 3 },
                { role: "OP", code: "OP", startPos: 4, endPos: 2 },
                { role: "OH2", code: "OH2", startPos: 5, endPos: 5 },
                { role: "L", code: "L", startPos: 6, endPos: 6 }
            ],
            2: [
                { role: "OH1", code: "OH1", startPos: 1, endPos: 5 },
                { role: "S", code: "S1", startPos: 6, endPos: 1 },
                { role: "L", code: "L", startPos: 5, endPos: 6 },
                { role: "OH2", code: "OH2", startPos: 4, endPos: 4 },
                { role: "OP", code: "OP", startPos: 3, endPos: 2 },
                { role: "M2", code: "M2", startPos: 2, endPos: 3 }
            ],
            3: [
                { role: "L", code: "L", startPos: 1, endPos: 6 },
                { role: "OH1", code: "OH1", startPos: 6, endPos: 5 },
                { role: "S", code: "S1", startPos: 5, endPos: 1 },
                { role: "OP", code: "OP", startPos: 2, endPos: 2 },
                { role: "OH2", code: "OH2", startPos: 3, endPos: 4 },
                { role: "M1", code: "M1", startPos: 4, endPos: 3 }
            ],
            4: [
                { role: "S", code: "S2", startPos: 1, endPos: 2 },
                { role: "OH1", code: "OH1", startPos: 5, endPos: 5 },
                { role: "L", code: "L", startPos: 6, endPos: 6 },
                { role: "OH2", code: "OH2", startPos: 2, endPos: 4 },
                { role: "M1", code: "M1", startPos: 3, endPos: 3 },
                { role: "OP", code: "OP", startPos: 4, endPos: 2 }
            ],
            5: [
                { role: "OH2", code: "OH2", startPos: 1, endPos: 5 },
                { role: "S", code: "S2", startPos: 6, endPos: 1 },
                { role: "L", code: "L", startPos: 5, endPos: 6 },
                { role: "OH1", code: "OH1", startPos: 4, endPos: 4 },
                { role: "OP", code: "OP", startPos: 3, endPos: 2 },
                { role: "M1", code: "M1", startPos: 2, endPos: 3 }
            ],
            6: [
                { role: "M1", code: "M1", startPos: 1, endPos: 3 },
                { role: "OH2", code: "OH2", startPos: 5, endPos: 5 },
                { role: "S", code: "S2", startPos: 4, endPos: 1 },
                { role: "OP", code: "OP", startPos: 2, endPos: 2 },
                { role: "OH1", code: "OH1", startPos: 3, endPos: 4 },
                { role: "M2", code: "M2", startPos: 4, endPos: 3 }
            ]
        };

        function renderInputs() {
            const container = document.getElementById("playerInputs");
            let html = "";
            ["S1", "S2", "OH1", "OH2", "M1", "M2", "OP", "L"].forEach(key => {
                html += `<div class="form-group"><label><strong>${key}</strong></label><input type="text" value="${players[key]}" oninput="updatePlayer('${key}', this.value)"></div>`;
            });
            container.innerHTML = html;
            updateCourt();
        }

        function updatePlayer(key, val) { players[key] = val; updateCourt(); }
        function setPhase(p) {
            phase = p;
            document.getElementById("btnServing").className = p === 'serving' ? 'active' : 'secondary';
            document.getElementById("btnSR").className = p === 'sr' ? 'active' : 'secondary';
            isShifted = false;
            updateCourt();
        }

        function toggleMotion() {
            isShifted = !isShifted;
            document.getElementById("btnMotion").innerText = isShifted ? "↺ Reset Original Position" : "▶ Animate Shift / Transition";
            updateCourt();
        }

        function rotateCourt(dir) {
            currentRotation = dir === 1 ? (currentRotation % 6 + 1) : (currentRotation === 1 ? 6 : currentRotation - 1);
            isShifted = false;
            document.getElementById("btnMotion").innerText = "▶ Animate Shift / Transition";
            updateCourt();
        }

        function updateCourt() {
            document.getElementById("rotNum").innerText = currentRotation;
            document.getElementById("subAlert").style.display = currentRotation >= 4 ? 'block' : 'none';

            const court = document.getElementById("courtArea");
            court.innerHTML = "";

            const layout = rotationData[currentRotation];

            layout.forEach(p => {
                const name = players[p.code] || p.code;
                const posKey = isShifted ? p.endPos : p.startPos;
                const coords = isShifted ? shiftedCoords[posKey] : standardCoords[posKey];

                const token = document.createElement("div");
                token.className = "player-token";
                token.style.left = `${coords.left}px`;
                token.style.top = `${coords.top}px`;

                token.innerHTML = `
                    <div class="player-badge">${name}</div>
                    <div class="role-badge role-${p.role}">${p.role}</div>
                `;
                court.appendChild(token);
            });
        }

        window.onload = renderInputs;
    </script>
</body>
</html>
